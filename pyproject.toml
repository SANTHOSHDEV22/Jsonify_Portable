[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "jsonify"
version = "1.0.0"
description = "Desktop application for exploring and visualizing JSON payloads"
requires-python = ">=3.12"

dependencies = [
    "PySide6>=6.6",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]


[project.scripts]
jsonify = "jsonify.__main__:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]